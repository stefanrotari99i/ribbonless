<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8dff" />
      <stop offset="1" stop-color="#5b5bf0" />
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#eef1f8" />
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1b1f6b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Tile -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#tile)" />
  <rect x="64" y="64" width="896" height="896" rx="200" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="4" />

  <!-- Page with a folded corner -->
  <g filter="url(#lift)">
    <path d="M300 214h330l140 140v416a40 40 0 0 1-40 40H300a40 40 0 0 1-40-40V254a40 40 0 0 1 40-40z" fill="url(#page)" />
    <path d="M630 214v104a36 36 0 0 0 36 36h104z" fill="#d7dcea" />
  </g>

  <!-- Lines of text -->
  <g fill="#c6cde0">
    <rect x="456" y="420" width="238" height="30" rx="15" />
    <rect x="330" y="490" width="364" height="30" rx="15" />
    <rect x="330" y="560" width="364" height="30" rx="15" />
    <rect x="330" y="630" width="230" height="30" rx="15" />
  </g>

  <!-- The ribbon, snipped: two pieces with a gap between them -->
  <g fill="#ff6b57">
    <path d="M340 190h86v118l-86 34z" />
    <path d="M340 382l86-34v132l-43-30-43 30z" />
  </g>
</svg>
