[package]
name = "ribbonless"
version = "0.1.0"
edition = "2021"
description = "A calm, fast editor for Word documents"
license = "MIT"
repository = "https://github.com/stefanrotari99i/ribbonless"
authors = ["Stefan Rotari"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
percent-encoding = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Com", "Win32_Graphics_DirectWrite", "Win32_System_Registry"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
opt-level = "s"
